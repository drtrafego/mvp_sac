# Bloco a ACRESCENTAR em /etc/nginx/conf.d/painel-os.conf, dentro do server
# painel.casaldotrafego.com e ANTES de `location /`.
#
# NAO aplicado automaticamente: mexer no nginx de producao exige autorizacao.
# Aplicacao: editar o arquivo, rodar `nginx -t` e `systemctl reload nginx`
# (reload, nao restart; nao derruba conexao em andamento).
#
# O painel estatico continua sendo servido pelo painel_os em 127.0.0.1:5199,
# atras da autenticacao HTTP que ja existe. Este bloco publica apenas a API do
# painel SAC, que tem autenticacao propria por operador, sessao server-side e
# trilha de auditoria. Nada aqui alcanca /webhooks/v2/, /livez ou /readyz.
location /sac/api/ {
    proxy_pass http://127.0.0.1:8188/api/v1/panel/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
    client_max_body_size 128k;

    # Defesa em profundidade opcional: manter tambem a senha do painel.
    # Exige um htpasswd equivalente ao arquivo de credencial do painel_os.
    # auth_basic "painel";
    # auth_basic_user_file /etc/nginx/painel-os.htpasswd;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
